<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto02</title>
    <link rel="stylesheet" href="/static/pgGame/style/host.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            background-color: black;
            background-image: none;
        }

        canvas {
            display: block;
            width: 854px;
            height: 480px;
            image-rendering: pixelated;
        }
        #noiseCanvas {
            image-rendering: auto;
            position: absolute;
            top: 0;
        }
        #fadeOut {
            width: 100%;
            height: 100%;
            position: absolute;
            background-color: black;
            opacity: 0;
            animation: fadeInOut 2s ease-in-out forwards;
        }
        .btn-interface {
            height: 25px;
            margin: 15px 15px 15px 0%;
            right: 0;
            cursor: pointer;
            z-index: 101;
            top: 0;
            pointer-events: all;
        }
    </style>
</head>
    <body>
        <div id="lateralMenu">
            <div class="select-bar">
                <span class="bar-element ativo">Jogo</span>
                <span class="bar-element">Vídeo</span>
                <span class="bar-element">Áudio</span>
                <span class="bar-element">Acessibilidade</span>
            </div>

        <div id="gameOption" class="menu-part">
            <div class="categories-element"><span>Tempo de Jogo</span></div>
            <div class="categories-container">
                <div class="element-container">
                    <span>Round 1:</span> <input id="roundtime1Input" class="input-container" type="number" value="240" max="360" min="10">
                </div>
                <div class="element-container">
                    <span>Round 2:</span> <input id="roundtime2Input" class="input-container" type="number" value="120" max="240" min="10">
                </div>
                <div class="element-container">
                    <span>Round 3:</span> <input id="roundtime3Input" class="input-container" type="number" value="90" max="120" min="10">
                </div>
                <div class="element-container">
                    <span>Votação:</span> <input id="roundtime4Input" class="input-container" type="number" value="30" max="90" min="10">
                </div>
            </div>
        </div>
        <div id="videoOption" class="menu-part">
            <div class="categories-element"><span>Qualidade</span></div>
            <div class="categories-container">
                <div class="element-container">
                    <span>Animações:</span>
                    <select class="select-container" id="animationSelect">
                        <option value="Alto">Alto</option>
                        <option value="Baixo">Baixo</option>
                    </select>
                </div>
            </div>
            <div class="categories-element"><span>Efeitos Visuais</span></div>
            <div class="categories-container">
                <div class="element-container">
                <span>Tela:</span> 
                <select class="select-container" id="screenSelect">
                    <option value="Ativado">Ativado</option>
                    <option value="Desativado">Desativado</option>
                </select>
                </div>
            </div>
        </div>
        <div id="audioOption" class="menu-part">
            <div class="categories-element"><span>Volume Geral</span></div>
            <div class="categories-container">
                <div class="element-container">
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                </div>
            </div>
        </div>
        <div id="accessibilityOption" class="menu-part">
            <div class="categories-element"><span>Legenda</span></div>
            <div class="categories-container">
                <div class="element-container">
                    <span>Legendas:</span> 
                    <select class="select-container" id="legendaActivationSelect">
                        <option value="Ativado">Ativado</option>
                        <option value="Desativado">Desativado</option>
                    </select>
                </div>
                <div class="element-container">
                    <span>Tamanho da Legenda:</span> 
                    <select class="select-container" id="legendaSizeSelect">
                        <option value="14">Normal</option>
                        <option value="11">Pequena</option>
                        <option value="18">Grande</option>
                    </select>
                </div>
            </div>
            <div class="caption-container teste">Legenda de teste! Oi teste!</div>
        </div>
        </div>
        <div class="menu-container" id="reportMenu">
            <section id="reportOption" class="menu-interactive">
                <div class="menu-part report">
                    <div class="categories-element report"><span>Feedback</span></div>
                </div>
                <form id="reportForm">
                    <div class="categories-container report">
                        <div class="menu-part report">
                            <div class="element-container report">
                                <label>Motivo</label>
                                <input maxlength="32" id="motivoInput" class="input-container" type="text" required>
                            </div>
                            <div class="element-container report">
                                <label>Descrição</label>
                                <textarea maxlength="256" rows="3" class="input-container" id="descricaoInput" required></textarea>
                            </div>
                        </div>
                        <button type="submit" id="sendReportBtn" class="secondary-btn">Enviar</button>
                    </div>
                </form>
            </section>
        </div>
        <img class="btn-interface" id="setting" src="/static/images/setting.svg" alt="">

        <div id="gameContainer">
            <canvas id="canvas"></canvas>
            <canvas id="noiseCanvas"></canvas>
        </div>
        
        <div id="errorContainer">
            <span id="errorMsg"></span>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
        <script>
            const roomId = "{{ room_id }}";
        </script>
        <script src="/static/projeto02/script/main.js"></script>
    </body>
</html>
